[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Old Wix addresses -> new pages
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/blank-*"
  to = "/"
  status = 301

[[redirects]]
  from = "/profile/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/trips-rates"
  to = "/charters/"
  status = 301

[[redirects]]
  from = "/trips-and-rates"
  to = "/charters/"
  status = 301

[[redirects]]
  from = "/book-online"
  to = "/charters/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
